paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required: [nombre, email, password]
                properties:
                  nombre:
                    type: string
                    description: Nombre del usuario
                  email:
                    type: string
                    format: email
                    description: Correo electrónico del usuario
                  password:
                    type: string
                    minLength: 6
                    description: Contraseña (mínimo 6 caracteres)
                  rol:
                    type: string
                    enum: [user, admin]
                    description: Rol del usuario (se ignora, siempre se asigna 'user')
      responses:
        201:
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      usuario:
                        type: object
                        properties:
                          _id:
                            type: string
                          nombre:
                            type: string
                          email:
                            type: string
                          rol:
                            type: string
                          active:
                            type: boolean
                      token:
                        type: string
                        description: JWT token
        400:
          description: Datos inválidos (error de validación)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "El nombre es obligatorio"
        409:
          description: El email ya está registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "El recurso ya existe (duplicado)"
        429:
          description: Demasiadas solicitudes (rate limit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      usuario:
                        type: object
                        properties:
                          _id:
                            type: string
                          nombre:
                            type: string
                          email:
                            type: string
                          rol:
                            type: string
                          active:
                            type: boolean
                      token:
                        type: string
                        description: JWT token
        400:
          description: Datos inválidos (error de validación)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
        401:
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Email o contraseña incorrectos"
        429:
          description: Demasiadas solicitudes (rate limit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: Obtener perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        200:
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      nombre:
                        type: string
                      email:
                        type: string
                      rol:
                        type: string
                      active:
                        type: boolean
        401:
          description: No autenticado (token inválido o ausente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Acceso no autorizado"
