paths:
  /api/v1/especies:
    get:
      tags: [Especies]
      summary: Listar especies activas
      responses:
        200:
          description: Lista de especies activas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Especie'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Especies]
      summary: Crear una especie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  description: Nombre de la especie
                descripcion:
                  type: string
                  nullable: true
                  description: Descripcion opcional de la especie
      responses:
        201:
          description: Especie creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Especie'
        400:
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (se requiere rol admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: La especie ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/especies/{id}:
    get:
      tags: [Especies]
      summary: Obtener una especie por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la especie
      responses:
        200:
          description: Especie encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Especie'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Especie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Especies]
      summary: Actualizar una especie
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la especie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre de la especie
                descripcion:
                  type: string
                  nullable: true
                  description: Descripcion opcional de la especie
      responses:
        200:
          description: Especie actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Especie'
        400:
          description: Datos invalidos o ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (se requiere rol admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Especie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: La especie ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Especies]
      summary: Desactivar una especie
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la especie
      responses:
        200:
          description: Especie desactivada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Especie'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (se requiere rol admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Especie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Especie:
      type: object
      properties:
        _id:
          type: string
          description: ID de la especie
        nombre:
          type: string
          description: Nombre de la especie
        descripcion:
          type: string
          nullable: true
          description: Descripcion de la especie
        active:
          type: boolean
          description: Estado activo de la especie
        createdAt:
          type: string
          format: date-time
          description: Fecha de creacion
        updatedAt:
          type: string
          format: date-time
          description: Fecha de ultima actualizacion
