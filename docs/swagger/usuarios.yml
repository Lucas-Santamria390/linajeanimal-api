openapi: 3.0.3
info:
  title: LinajeAnimal - Módulo de Usuarios
  version: 1.2.0
  description: Especificación de endpoints para la gestión de usuarios (Exclusivo para Administradores).

paths:
  /api/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar todos los usuarios (admin - Paginado)
      description: Retorna todos los usuarios registrados con estructura de paginación. Solo accesible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número de página
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Cantidad de registros por página
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Listado paginado de usuarios obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  pagination:
                    type: object
                    properties:
                      totalDocs:
                        type: integer
                        example: 25
                      limit:
                        type: integer
                        example: 10
                      page:
                        type: integer
                        example: 1
                      totalPages:
                        type: integer
                        example: 3
                      hasNextPage:
                        type: boolean
                        example: true
                      hasPrevPage:
                        type: boolean
                        example: false
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        500:
          $ref: '#/components/responses/500InternalError'

    post:
      tags: [Usuarios]
      summary: Crear un usuario (admin)
      description: Crea un nuevo usuario. Permite asignar rol de manera directa. Solo accesible para administradores.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre:
                  type: string
                  example: "Carlos Mendoza"
                email:
                  type: string
                  format: email
                  example: "carlos@linajeanimal.com"
                password:
                  type: string
                  minLength: 8
                  description: Contraseña (Mínimo 8 caracteres tras actualización de seguridad)
                  example: "AdminPass2026*"
                rol:
                  type: string
                  enum: [admin, user]
                  default: user
                  example: "user"
      responses:
        201:
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        400:
          $ref: '#/components/responses/400BadRequest'
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        409:
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener detalle de un usuario (admin)
      description: Retorna la información completa de un usuario específico. Solo accesible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del usuario (ObjectId)
      responses:
        200:
          description: Datos del usuario encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        400:
          $ref: '#/components/responses/400BadRequest'
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        404:
          $ref: '#/components/responses/404NotFound'

    put:
      tags: [Usuarios]
      summary: Actualizar un usuario (admin)
      description: Actualiza los datos de un usuario (nombre, email, rol). No permite modificar contraseña desde aquí. Solo accesible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del usuario a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Carlos Mendoza Modificado"
                email:
                  type: string
                  format: email
                  example: "carlos.m@linajeanimal.com"
                rol:
                  type: string
                  enum: [admin, user]
                  example: "admin"
      responses:
        200:
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        400:
          $ref: '#/components/responses/400BadRequest'
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        404:
          $ref: '#/components/responses/404NotFound'

    delete:
      tags: [Usuarios]
      summary: Desactivar un usuario — Soft Delete (admin)
      description: Realiza la desactivación lógica del usuario. No se puede desactivar el propio usuario logueado. Solo accesible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del usuario a desactivar
      responses:
        200:
          description: Usuario desactivado exitosamente (Soft Delete)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        400:
          description: Intento de auto-desactivación o ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        404:
          $ref: '#/components/responses/404NotFound'

    patch:
      tags: [Usuarios]
      summary: Activar o desactivar estado de un usuario (admin)
      description: Cambia explícitamente el campo active. Solo accesible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
                  description: true para activar cuenta, false para desactivar
                  example: true
      responses:
        200:
          description: Estado actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        400:
          $ref: '#/components/responses/400BadRequest'
        401:
          $ref: '#/components/responses/401Unauthorized'
        403:
          $ref: '#/components/responses/403Forbidden'
        404:
          $ref: '#/components/responses/404NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        _id:
          type: string
          example: "649ab2c3e4b0c5123456789a"
        nombre:
          type: string
          example: "Alejandro Gómez"
        email:
          type: string
          format: email
          example: "alejandro@linajeanimal.com"
        rol:
          type: string
          enum: [admin, user]
          example: "user"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T08:22:11.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-27T14:00:00.000Z"

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Descripción detallada del error controlado"

  responses:
    400BadRequest:
      description: Solicitud incorrecta. Argumentos mal formados o fallas de validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    401Unauthorized:
      description: No autenticado. Token ausente, corrupto o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    403Forbidden:
      description: Acceso prohibido. Se requiere rol de Administrador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    500InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'