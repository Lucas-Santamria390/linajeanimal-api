paths:
  /api/v1/animales:
    get:
      tags: [Animales]
      summary: Listar animales activos
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: nombre
          schema:
            type: string
          description: Filtra por nombre
        - in: query
          name: especie
          schema:
            type: string
          description: Filtra por ID de especie
        - in: query
          name: raza
          schema:
            type: string
          description: Filtra por ID de raza
        - in: query
          name: sexo
          schema:
            type: string
            enum: [macho, hembra]
          description: Filtra por sexo
        - in: query
          name: identificador
          schema:
            type: string
          description: Filtra por identificador (busqueda parcial)
        - in: query
          name: active
          schema:
            type: boolean
          description: "Filtra por estado activo/inactivo (default: solo activos)"
        - in: query
          name: propietario
          schema:
            type: string
          description: Filtra por ID de propietario (admin puede ver todos; usuario regular solo ve sus animales)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Pagina solicitada
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Tamano de pagina
      responses:
        200:
          description: Lista de animales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Animal'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Animales]
      summary: Crear un animal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, especie, raza, sexo, fechaNacimiento]
              properties:
                nombre:
                  type: string
                  description: Nombre del animal (opcional)
                identificador:
                  type: string
                  description: Identificador unico del animal (arete, microchip, etc.)
                especie:
                  type: string
                  description: ID de la especie (se transforma a objeto embebido en backend)
                raza:
                  type: string
                  description: ID de la raza (se transforma a objeto embebido en backend)
                sexo:
                  type: string
                  enum: [macho, hembra]
                  description: Sexo del animal
                fechaNacimiento:
                  type: string
                  format: date-time
                  description: Fecha de nacimiento (no puede ser futura)
                peso:
                  type: number
                  description: Peso en kg
                color:
                  type: string
                  description: Color del animal
                fotoUrl:
                  type: string
                  description: URL de la foto
                notas:
                  type: string
                  description: Notas adicionales
                padre:
                  type: string
                  nullable: true
                  description: ID del padre (debe ser macho y misma especie)
                madre:
                  type: string
                  nullable: true
                  description: ID de la madre (debe ser hembra y misma especie)
      responses:
        201:
          description: Animal creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Animal'
        400:
          description: Datos invalidos (validacion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Conflicto (identificador duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/animales/{id}:
    get:
      tags: [Animales]
      summary: Obtener un animal por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      responses:
        200:
          description: Animal encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Animal'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Animales]
      summary: Actualizar un animal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre del animal
                especie:
                  type: string
                  description: ID de la especie (se transforma a objeto embebido en backend)
                raza:
                  type: string
                  description: ID de la raza (se transforma a objeto embebido en backend)
                sexo:
                  type: string
                  enum: [macho, hembra]
                  description: Sexo del animal
                fechaNacimiento:
                  type: string
                  format: date-time
                  description: Fecha de nacimiento (no puede ser futura)
                peso:
                  type: number
                  description: Peso en kg
                color:
                  type: string
                  description: Color del animal
                identificador:
                  type: string
                  description: Identificador unico
                fotoUrl:
                  type: string
                  description: URL de la foto
                notas:
                  type: string
                  description: Notas adicionales
      responses:
        200:
          description: Animal actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Animal'
        400:
          description: Datos invalidos (validacion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Animales]
      summary: Desactivar un animal (soft delete, solo admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      responses:
        200:
          description: Animal desactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Animal'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (se requiere rol admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/animales/{id}/family-tree:
    get:
      tags: [Animales]
      summary: Obtener el arbol genealogico de un animal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
        - in: query
          name: generaciones
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Profundidad maxima del arbol (default 3, max 5)
      responses:
        200:
          description: Arbol genealogico
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      generaciones:
                        type: integer
                      arbol:
                        type: object
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/animales/{id}/children:
    get:
      tags: [Animales]
      summary: Listar hijos directos de un animal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      responses:
        200:
          description: Lista de hijos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Animal'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/animales/{id}/siblings:
    get:
      tags: [Animales]
      summary: Listar hermanos de un animal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      responses:
        200:
          description: Lista de hermanos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Animal'
        400:
          description: ID invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/animales/{id}/parents:
    post:
      tags: [Animales]
      summary: Asignar o desasignar padres
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                padre:
                  type: string
                  nullable: true
                  description: ID del padre (null para desasignar)
                madre:
                  type: string
                  nullable: true
                  description: ID de la madre (null para desasignar)
      responses:
        200:
          description: Padres actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Animal'
        400:
          description: Datos invalidos (validacion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Sin permisos (no eres el propietario ni admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Animal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Animal:
      type: object
      properties:
        _id:
          type: string
        nombre:
          type: string
        sexo:
          type: string
          enum: [macho, hembra]
        fechaNacimiento:
          type: string
          format: date-time
        peso:
          type: number
        color:
          type: string
        identificador:
          type: string
        fotoUrl:
          type: string
        notas:
          type: string
        active:
          type: boolean
        cantidadHijos:
          type: integer
        especie:
          type: object
          description: Referencia extendida de la especie
          properties:
            _id:
              type: string
            nombre:
              type: string
        raza:
          type: object
          description: Referencia extendida de la raza
          properties:
            _id:
              type: string
            nombre:
              type: string
        propietario:
          type: object
          description: Referencia extendida del usuario propietario
          properties:
            _id:
              type: string
            nombre:
              type: string
            email:
              type: string
        padre:
          type: string
          nullable: true
          description: "ObjectId del padre (ref: Animal)"
        madre:
          type: string
          nullable: true
          description: "ObjectId de la madre (ref: Animal)"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
