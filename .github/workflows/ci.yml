name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: cp .env.example .env

      - name: Start server
        run: |
          npm start &
          sleep 4
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/linajeanimal-test
          JWT_SECRET: ci-secret

      - name: Health check
        run: curl -f http://localhost:3000/api/v1/health || exit 1
